name: Release

on:
  push:
    tags: ["v*"]
  # Called by auto-release.yml after it pushes a tag on merge to master.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and release, e.g. v1.1.0
        type: string
        required: true
      publish:
        description: Publish the release instead of leaving it as a draft
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Manual tag pushes use the pushed ref; workflow_call passes the tag explicitly.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync
      - id: check
        # `shell: bash` gives `-eo pipefail`; the default shell would take tee's exit code.
        shell: bash
        run: uv run python scripts/check_release.py | tee -a "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      WOWFISH_HOME: ${{ github.workspace }}/.wowfish-home
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest -v
      - run: uv run pyinstaller --clean --noconfirm packaging/wowfish.spec

      - name: Smoke GUI window (Linux)
        if: runner.os == 'Linux'
        # `--version` never loads Tk. Open the real window on a virtual display: it must still be
        # running when timeout stops it (exit 124); a missing module exits sooner with 1.
        run: timeout 15 xvfb-run -a ./dist/wowfish-gui || test $? -eq 124

      - name: Smoke GUI window (Windows)
        # Open the real window: unlike `--version` it runs logging setup with no console. A crash
        # here doesn't exit, PyInstaller shows a blocking "Unhandled exception in script" dialog
        # instead, so wait for the app's own window title rather than for the process to live.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process .\dist\wowfish-gui.exe
          $title = ''
          for ($i = 0; $i -lt 30 -and $title -notlike 'Wow Forever - Fishing Assist *'; $i++) {
            Start-Sleep 1
            $title = (Get-Process wowfish-gui -ErrorAction SilentlyContinue |
              Where-Object MainWindowTitle | Select-Object -First 1).MainWindowTitle
          }
          Get-Process wowfish-gui -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($title -notlike 'Wow Forever - Fishing Assist *') {
            Write-Error "wowfish-gui.exe never opened its window (last window title: '$title')"
            exit 1
          }

      - name: Smoke and rename (POSIX)
        if: runner.os != 'Windows'
        run: |
          ./dist/wowfish --version
          ./dist/wowfish doctor
          ./dist/wowfish-gui --version
          mv dist/wowfish "dist/wowfish-${RELEASE_TAG#v}-${{ matrix.target }}"
          mv dist/wowfish-gui "dist/wowfish-gui-${RELEASE_TAG#v}-${{ matrix.target }}"

      - name: Smoke and rename (Windows)
        # wowfish-gui.exe is a windowed app: PowerShell only waits for it (and sets
        # $LASTEXITCODE) when its output is piped.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\wowfish.exe --version; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\dist\wowfish.exe doctor;    if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\dist\wowfish-gui.exe --version | Out-Host; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $v = $env:RELEASE_TAG.TrimStart("v")
          Move-Item dist\wowfish.exe "dist\wowfish-$v-${{ matrix.target }}.exe"
          Move-Item dist\wowfish-gui.exe "dist\wowfish-gui-$v-${{ matrix.target }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/wowfish-*
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    # Never publish if preflight produced no verdict.
    if: needs.preflight.outputs.prerelease != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum wowfish-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
          # Manual tag pushes stay drafts; auto releases are published so self-update sees them.
          draft: ${{ !inputs.publish }}
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
